 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(90deg, #e2e2e2, #c9d6ff);
        }
        
        .container-card {
            position: relative;
            width: 850px;
            height: 550px;
            background: #fff;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            margin: 20px;
            overflow: hidden;
        }
        
        .container-card p {
            font-size: 14.5px;
            margin: 15px 0;
        }
        
        .form-box {
            position: absolute;
            width: 50%;
            height: 100%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            text-align: center;
            padding: 40px;
            transition: 0.5s ease-in-out;
            z-index: 1;
        }
        
        .form-box.login {
            right: 0;
        }
        
        .form-box.register {
            left: 100%;
        }
        
        .container-card.active .form-box.login {
            right: -100%;
        }
        
        .container-card.active .form-box.register {
            left: 0;
            transform: translateX(0);
        }
        
        form {
            width: 100%;
        }
        
        .container-card h1 {
            font-size: 36px;
            margin: -10px 0;
        }
        
        h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        
        .input-group {
            position: relative;
            margin: 30px 0;
        }
        
        .input-group input {
            width: 100%;
            padding: 13px 50px 13px 20px;
            background: #eee;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }
        
        .input-group input::placeholder {
            color: #888;
            font-weight: 400;
        }
        
        .input-group i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #888;
        }
        
        .forgot-link {
            margin: -15px 0 15px;
            text-align: right;
            display: block;
        }
        
        .forgot-link a {
            font-size: 14.5px;
            color: #333;
            text-decoration: none;
        }
        
        .btn {
            width: 100%;
            height: 48px;
            background: #7494ec;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .1);
            border: none;
            cursor: pointer;
            color: #fff;
            font-weight: 600;
        }
        
        .toggle-box {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .toggle-box::before {
            content: '';
            position: absolute;
            left: -250%;
            width: 300%;
            height: 100%;
            background: #DE8B0B;
            border-radius: 150px;
            z-index: 2;
            transition: 1.8s ease-in-out;
        }
        
        .container-card.active .toggle-box::before {
            left: 50%;
        }
        
        .toggle-panel {
            position: absolute;
            width: 50%;
            height: 100%;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3;
            transition: .6s ease-in-out;
        }
        
        .toggle-panel.toggle-left {
            left: 0;
            transition-delay: 1.2s;
        }
        
        .container-card.active .toggle-panel.toggle-left {
            left: -50%;
            transition-delay: .5s;
        }
        
        .toggle-panel.toggle-right {
            right: -50%;
            transition-delay: .6s;
        }
        
        .container-card.active .toggle-panel.toggle-right {
            right: 0;
            transition-delay: 1.2s;
        }
        
        .toggle-panel p {
            margin-bottom: 20px;
        }
        
        .toggle-btn {
            width: 160px;
            height: 46px;
            background: transparent;
            border: 2px solid #fff;
            box-shadow: none;
            color: #fff;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container-card">
        <div class="form-box login">
            <form>
                <h2>Login</h2>
                <div class="input-group">
                    <input type="text" placeholder="Username" required>
                    <i class="bi bi-person"></i>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                    <i class="bi bi-lock"></i>
                </div>
                <div class="forgot-link">
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
        
        <div class="form-box register">
            <form>
                <h2>Register</h2>
                <div class="input-group">
                    <input type="text" placeholder="Username" required>
                    <i class="bi bi-person"></i>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Email" required>
                    <i class="bi bi-envelope"></i>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                    <i class="bi bi-lock"></i>
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
        </div>
        
        <div class="toggle-box">
            
            <div class="toggle-panel toggle-left">
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <button class="toggle-btn register-btn">Register</button>
            </div>
            
            
            <div class="toggle-panel toggle-right">
                <h1>Welcome Back</h1>
                <p>Already have an account?</p>
                <button class="toggle-btn login-btn">Login</button>
            </div>
        </div>
    </div>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.container-card');
            const registerBtn = document.querySelector('.register-btn');
            const loginBtn = document.querySelector('.login-btn');
            
            registerBtn.addEventListener('click', () => {
                container.classList.add('active');
            });
            
            loginBtn.addEventListener('click', () => {
                container.classList.remove('active');
            });
        });
    </script>
</body>
</html>
