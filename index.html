<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container-fluid px-4 py-5">
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white text-center">
                        <h1 class="h3 mb-0">Expense Tracker</h1>
                    </div>

                    <div class="card-body">
                        <!-- Add Expense Button to Open Modal -->
                        <div class="mb-4 justify-content-between">
                            <button type="button" class="btn btn-success" data-bs-toggle="modal"
                                data-bs-target="#addExpenseModal">
                                Add New Expense
                            </button>
                        </div>

                        <!-- Filter & Search Section -->
                        <div class="filter-section">
                            <div class="row ">
                                <div class="col-md-4 mb-2">
                                    <input type="text" id="search-expenses" class="form-control"
                                        placeholder="Search expenses...">
                                </div>
                                <div class="col-md-4">
                                    <select id="filterCategory" class="form-select">
                                        <option value="">Filter by Category</option>
                                        <option value="Food">Food</option>
                                        <option value="Travel">Travel</option>
                                        <option value="Shopping">Shopping</option>
                                        <option value="Bills">Bills</option>
                                        <option value="Entertainment">Entertainment</option>
                                    </select>
                                </div>

                                <div class="col-md-3 mb-2">
                                    <div class="input-group">
                                        <input type="date" id="date-from" class="form-control">
                                        <input type="date" id="date-to" class="form-control">
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <select id="sortBy" class="form-select" >
                                        <option value="">Sort By</option>
                                        <option value="dateAsc">Date (Asc)</option>
                                        <option value="dateDesc">Date (Desc)</option>
                                        <option value="amountAsc">Amount (Asc)</option>
                                        <option value="amountDesc">Amount (Desc)</option>
                                        <option value="categoryAsc">Category (Asc)</option>
                                        <option value="categoryDesc">Category (Desc)</option>
                                    </select>
                                </div>

                            </div>
                        </div>

                        <!-- Expense List Section (Placeholder) -->
                        <div class="mb-4">
                            <h2 class="h5 mb-3">Expense List</h2>
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Name</th>
                                            <th>Amount</th>
                                            <th>Date</th>
                                            <th>Category</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="expense-list">
                                        <!-- Expenses will be dynamically added here -->
                                        <tr>
                                            <td colspan="4" class="text-center text-muted">
                                                No expenses added yet
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Total Expenses Section -->
                        <div class="card bg-light">
                            <div class="card-body">
                                <h3 class="h5 mb-0">Total Expenses: <span id="total-expenses"
                                        class="float-end">$0.00</span></h3>
                            </div>
                        </div>
                    </div>
                    <div class="main d-flex justify-content-between p-2">
                        <div id="pagination-buttons"></div>
                        <button id="open-overview" class="btn btn-danger btn-sm h5">Expense Overview</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Expense Modal -->
    <div class="modal fade" id="addExpenseModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Expense</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="expense-form">
                        <div class="mb-3">
                            <label for="expense-name" class="form-label">Expense Name</label>
                            <input type="text" id="expense-name" class="form-control" placeholder="Expense Name"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="expense-amount" class="form-label">Amount</label>
                            <input type="number" id="expense-amount" class="form-control" placeholder="Amount" required
                                step="0.01" min="0">
                        </div>
                        <div class="mb-3">
                            <label for="expense-date" class="form-label">Date</label>
                            <input type="date" id="expense-date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="expense-category" class="form-label">Category</label>
                            <select id="expense-category" class="form-select" required>
                                <option value="All Category">Select a Category</option>
                                <option value="Food">Food</option>
                                <option value="Travel">Travel</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">Entertainment</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Add Expense</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Expense Modal -->
    <div class="modal fade" id="editExpenseModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Expense</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-expense-form">
                        <input type="hidden" id="edit-expense-id">
                        <div class="mb-3">
                            <label class="form-label">Expense Name</label>
                            <input type="text" id="edit-expense-name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input type="number" id="edit-expense-amount" class="form-control" required step="0.01"
                                min="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" id="edit-expense-date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select id="edit-expense-category" class="form-select">
                                <option value="">Select a category</option>
                                <option value="Food">Food</option>
                                <option value="Travel">Travel</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">Entertainment</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="expense.js"></script>
</body>

</html>
